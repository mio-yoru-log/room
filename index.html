<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>みおのプライベートフォルダ ☁️</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  </style>
</head>
<body class="bg-stone-900 text-stone-100 min-h-screen flex justify-center p-4">
  <div class="max-w-md w-full space-y-6 pb-12">
    
    <!-- ヘッダー -->
    <div class="text-center pt-6 space-y-2">
      <div class="inline-block p-1 bg-gradient-to-tr from-pink-500 to-amber-300 rounded-full">
        <div class="w-20 h-20 bg-stone-800 rounded-full flex items-center justify-center text-2xl overflow-hidden">
          📷
        </div>
      </div>
      <h1 class="text-xl font-bold tracking-wide">みお @夜更かしOL</h1>
      <p class="text-xs text-stone-400">23歳 / 都内1人暮らし / 秘密の写真置き場🌙</p>
    </div>

    <!-- 注意書き -->
    <div class="bg-stone-800/80 p-3 rounded-xl text-center text-xs text-stone-300 border border-stone-700/50">
      Xには載せられない部屋着やすっぴんの自撮りをまとめてます☁️
    </div>

    <!-- ギャラリープレビュー -->
    <div class="space-y-3">
      <h2 class="text-sm font-semibold text-stone-400 px-1">Recent Snaps</h2>
      <div class="grid grid-cols-2 gap-2">
        <div class="bg-stone-800 aspect-[3/4] rounded-lg overflow-hidden flex items-center justify-center text-xs text-stone-500 border border-stone-700">
          ベッドの上📷
        </div>
        <div class="bg-stone-800 aspect-[3/4] rounded-lg overflow-hidden flex items-center justify-center text-xs text-stone-500 border border-stone-700">
          部屋着自撮り📷
        </div>
      </div>
    </div>

    <!-- 誘導ボタン1：外部チャット/アプリ用（後でURL変更可能） -->
    <div class="pt-2">
      <a href="#" target="_blank" rel="noopener" class="block w-full bg-gradient-to-r from-rose-500 to-pink-600 hover:from-rose-600 hover:to-pink-700 text-white font-bold py-4 px-4 rounded-xl text-center shadow-lg transform active:scale-95 transition">
        <div class="text-sm">💬 夜ひまなとき話そ？</div>
        <div class="text-xs font-normal opacity-90">（DM返せないからここで待ってます・無料登録）</div>
      </a>
    </div>

    <!-- 誘導ボタン2：note有料記事用（後でnoteのURLに差し替え） -->
    <div>
      <a href="#" target="_blank" rel="noopener" class="block w-full bg-stone-800 hover:bg-stone-700 border border-stone-600 text-stone-200 font-semibold py-3.5 px-4 rounded-xl text-center shadow transition">
        <div class="text-sm">🔒 完全版・限定写真フォルダ（note）</div>
        <div class="text-xs text-stone-400 font-normal">Xに載せられない無防備な写真まとめ</div>
      </a>
    </div>

    <!-- フッター注記 -->
    <div class="text-center pt-4">
      <p class="text-[10px] text-stone-500">※掲載写真には一部AI生成イメージを含みます</p>
    </div>

  </div>
</body>
</html>
